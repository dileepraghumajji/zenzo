name: Feature Request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem this solves
      description: What pain point does this address? Who is affected?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you thought about?

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 — critical, blocks launch
        - P1 — important, next sprint
        - P2 — nice to have
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Auth / Onboarding
        - Members
        - Batches
        - Attendance
        - Payments
        - Settings / Staff
        - Portal (consumer)
        - Explore / Public pages
        - Platform / Infrastructure
    validations:
      required: true
